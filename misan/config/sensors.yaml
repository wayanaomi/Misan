# Input sensor schema for the Misan MVP (PRD Section 9.1).
# `unit` and `valid_range` drive ingestion validation and out-of-range flagging (FR-2).
# Ranges are generous engineering bounds for a small-to-medium vapour-compression
# system, not manufacturer specifications — documented assumption, revisit once the
# real physics simulator / plant sensor list is confirmed (PRD Open Question 1-3).

sampling_interval_seconds: 60
window_length_samples: 15 # 15 minutes of history per diagnostic window (documented assumption, PRD Open Question 2)

signals:
  - name: suction_pressure
    unit: kPa
    valid_range: [50, 1200]
  - name: discharge_pressure
    unit: kPa
    valid_range: [500, 4500]
  - name: suction_temperature
    unit: celsius
    valid_range: [-20, 40]
  - name: discharge_temperature
    unit: celsius
    valid_range: [30, 140]
  - name: condenser_inlet_temperature
    unit: celsius
    valid_range: [0, 55]
  - name: condenser_outlet_temperature
    unit: celsius
    valid_range: [0, 70]
  - name: evaporator_inlet_temperature
    unit: celsius
    valid_range: [-20, 30]
  - name: evaporator_outlet_temperature
    unit: celsius
    valid_range: [-20, 30]
  - name: refrigerant_mass_flow
    unit: kg_per_hour
    valid_range: [0, 2000]
  - name: compressor_power
    unit: kW
    valid_range: [0, 50]
  - name: ambient_temperature
    unit: celsius
    valid_range: [-10, 50]
  - name: load_setpoint
    unit: celsius
    valid_range: [5, 30]
