[project]
name = "misan"
version = "0.1.0"
description = "Misan — AI fault detection and diagnosis module for HVAC systems"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "shap>=0.45",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "pyarrow>=15.0",
    "streamlit>=1.32",
    "requests>=2.31",
    "joblib>=1.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools]
packages = ["misan"]
include-package-data = true

[tool.setuptools.package-data]
misan = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
